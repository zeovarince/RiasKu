<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel | RiasKu</title>
  <meta name="description"
    content="Panel admin e-commerce kosmetik UMKM RiasKu - Manajemen katalog, pesanan, stok, dan keuangan.">
  <meta name="theme-color" content="#9C4A63">

  <!-- Google Fonts: Poppins (400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Admin Stylesheet: Vanilla CSS, Tanpa Gradien -->
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>

  <!-- =======================================================================
       SVG Symbol Sprite: Ikon Garis Inline (Gaya Lucide, Stroke 1.75px)
       Tanpa Emoji - Stroke currentColor
       ======================================================================= -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-layout-dashboard" viewBox="0 0 24 24">
      <rect width="7" height="9" x="3" y="3" rx="1" />
      <rect width="7" height="5" x="14" y="3" rx="1" />
      <rect width="7" height="9" x="14" y="12" rx="1" />
      <rect width="7" height="5" x="3" y="16" rx="1" />
    </symbol>

    <symbol id="icon-package" viewBox="0 0 24 24">
      <path d="m7.5 4.27 9 5.15" />
      <path
        d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
      <path d="m3.3 7 8.7 5 8.7-5" />
      <path d="M12 22V12" />
    </symbol>

    <symbol id="icon-shopping-bag" viewBox="0 0 24 24">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
      <path d="M3 6h18" />
      <path d="M16 10a4 4 0 0 1-8 0" />
    </symbol>

    <symbol id="icon-wallet" viewBox="0 0 24 24">
      <path
        d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
    </symbol>

    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path
        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </symbol>

    <symbol id="icon-tags" viewBox="0 0 24 24">
      <path d="m15 5 6.3 6.3a2.4 2.4 0 0 1 0 3.4L17 19" />
      <path
        d="M9.586 5.586A2 2 0 0 0 8.172 5H3a1 1 0 0 0-1 1v5.172a2 2 0 0 0 .586 1.414L8.29 18.29a2.4 2.4 0 0 0 3.42 0l4.58-4.58a2.4 2.4 0 0 0 0-3.42z" />
      <circle cx="6.5" cy="8.5" r=".5" fill="currentColor" />
    </symbol>

    <symbol id="icon-star" viewBox="0 0 24 24">
      <polygon
        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </symbol>

    <symbol id="icon-receipt" viewBox="0 0 24 24">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
      <path d="M12 17.5v-11" />
    </symbol>

    <symbol id="icon-package-plus" viewBox="0 0 24 24">
      <path d="M16 16h6" />
      <path d="M19 13v6" />
      <path
        d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14" />
      <path d="m7.5 4.27 9 5.15" />
      <path d="M3.29 7 12 12l8.71-5" />
      <path d="M12 22V12" />
    </symbol>

    <symbol id="icon-hand-coins" viewBox="0 0 24 24">
      <path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17" />
      <path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9" />
      <path d="m2 16 6 6" />
      <circle cx="16" cy="9" r="2.9" />
      <circle cx="6" cy="5" r="3" />
    </symbol>

    <symbol id="icon-bar-chart-3" viewBox="0 0 24 24">
      <path d="M3 3v18h18" />
      <path d="M18 17V9" />
      <path d="M13 17V5" />
      <path d="M8 17v-3" />
    </symbol>

    <symbol id="icon-external-link" viewBox="0 0 24 24">
      <path d="M15 3h6v6" />
      <path d="M10 14 21 3" />
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </symbol>

    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" x2="12" y1="15" y2="3" />
    </symbol>

    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
      <circle cx="12" cy="13" r="3" />
    </symbol>

    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12" />
    </symbol>

    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M5 12h14" />
      <path d="M12 5v14" />
    </symbol>

    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6" />
    </symbol>

    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6" />
    </symbol>

    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>

    <symbol id="icon-log-out" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" x2="9" y1="12" y2="12" />
    </symbol>

    <symbol id="icon-alert-triangle" viewBox="0 0 24 24">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
      <line x1="12" x2="12" y1="9" y2="13" />
      <line x1="12" x2="12.01" y1="17" y2="17" />
    </symbol>

    <symbol id="icon-alert-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" x2="12" y1="8" y2="12" />
      <line x1="12" x2="12.01" y1="16" y2="16" />
    </symbol>

    <symbol id="icon-banknote" viewBox="0 0 24 24">
      <rect width="20" height="12" x="2" y="6" rx="2" />
      <circle cx="12" cy="12" r="2" />
      <path d="M6 12h.01M18 12h.01" />
    </symbol>

    <symbol id="icon-menu" viewBox="0 0 24 24">
      <line x1="4" x2="20" y1="12" y2="12" />
      <line x1="4" x2="20" y1="6" y2="6" />
      <line x1="4" x2="20" y1="18" y2="18" />
    </symbol>

    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </symbol>

    <symbol id="icon-trash-2" viewBox="0 0 24 24">
      <path d="M3 6h18" />
      <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
      <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
      <line x1="10" x2="10" y1="11" y2="17" />
      <line x1="14" x2="14" y1="11" y2="17" />
    </symbol>

    <symbol id="icon-message-circle" viewBox="0 0 24 24">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
    </symbol>
  </svg>

  <div class="admin-shell">

    <!-- =====================================================================
         3.1 Rail Ikon Tetap (Lebar 64px, Layar >= 768px)
         ===================================================================== -->
    <aside class="admin-rail" aria-label="Navigasi Utama Rail">
      <!-- Atas: Logo RiasKu Kotak Krem 36px -->
      <div class="rail-top">
        <a href="#ringkasan" class="rail-logo" title="RiasKu Admin Panel">
          <img src="RiasKu Serif R App Icon.png" alt="RiasKu">
        </a>
        <div class="rail-divider"></div>
      </div>

      <!-- Tengah: Ikon Menu Navigasi -->
      <nav class="rail-mid" aria-label="Menu Utama">
        <!-- 1. Ringkasan -->
        <a href="#ringkasan" class="rail-item active" data-group="ringkasan" aria-label="Ringkasan Toko"
          aria-haspopup="menu" aria-expanded="false" role="button">
          <svg class="icon">
            <use href="#icon-layout-dashboard"></use>
          </svg>
        </a>

        <!-- 2. Katalog (Produk, Kategori, Ulasan) -->
        <a href="#produk" class="rail-item" data-group="katalog" aria-label="Katalog Produk" aria-haspopup="menu"
          aria-expanded="false" role="button">
          <svg class="icon">
            <use href="#icon-package"></use>
          </svg>
        </a>

        <!-- 3. Pesanan (Dengan Lencana 4) -->
        <a href="#pesanan" class="rail-item" data-group="pesanan" aria-label="Pesanan Pelanggan" aria-haspopup="menu"
          aria-expanded="false" role="button">
          <svg class="icon">
            <use href="#icon-shopping-bag"></use>
          </svg>
          <span class="rail-badge">4</span>
        </a>

        <!-- 4. Stok dan Keuangan (Dengan Lencana 3) -->
        <a href="#barang-masuk" class="rail-item" data-group="stokKeuangan" aria-label="Stok dan Keuangan"
          aria-haspopup="menu" aria-expanded="false" role="button">
          <svg class="icon">
            <use href="#icon-wallet"></use>
          </svg>
          <span class="rail-badge">3</span>
        </a>

        <!-- 5. Pengaturan Toko -->
        <a href="#pengaturan" class="rail-item" data-group="pengaturan" aria-label="Pengaturan Toko"
          aria-haspopup="menu" aria-expanded="false" role="button">
          <svg class="icon">
            <use href="#icon-settings"></use>
          </svg>
        </a>
      </nav>

      <!-- Bawah: Divider & Avatar Admin -->
      <div class="rail-bottom">
        <div class="rail-divider"></div>
        <div class="rail-avatar" data-group="profil" tabindex="0" aria-label="Profil Admin" aria-haspopup="menu"
          aria-expanded="false" role="button">
          AD
        </div>
      </div>
    </aside>

    <!-- =====================================================================
         3.2 Flyout Detail Menu (Muncul Saat Hover / Fokus)
         ===================================================================== -->
    <div id="adminFlyout" class="admin-flyout-container" aria-label="Menu Flyout Detail">
      <!-- Diisi secara dinamis oleh JavaScript -->
    </div>

    <!-- =====================================================================
         3.5 Drawer Mobile Hamburger (Layar < 768px)
         ===================================================================== -->
    <div id="mobileOverlay" class="mobile-overlay" aria-hidden="true"></div>

    <aside id="mobileDrawer" class="mobile-drawer" aria-label="Navigasi Mobile">
      <div class="drawer-header">
        <div class="drawer-brand">
          <div class="drawer-brand-logo">
            <img src="RiasKu Serif R App Icon.png" alt="RiasKu">
          </div>
          <div>
            <div class="drawer-brand-name">RiasKu</div>
            <div class="drawer-brand-sub">Admin Panel</div>
          </div>
        </div>
        <button id="btnDrawerClose" class="drawer-close" aria-label="Tutup menu">
          <svg class="icon icon-md">
            <use href="#icon-x"></use>
          </svg>
        </button>
      </div>

      <nav class="drawer-nav">
        <div class="drawer-group-label">Utama</div>
        <a href="#ringkasan" class="drawer-link active" data-route="ringkasan">
          <svg class="icon icon-md">
            <use href="#icon-layout-dashboard"></use>
          </svg>
          Ringkasan
        </a>

        <div class="drawer-group-label">Katalog Produk</div>
        <div class="drawer-accordion">
          <button type="button" class="drawer-accordion-btn">
            <span class="left">
              <svg class="icon icon-md">
                <use href="#icon-package"></use>
              </svg>
              Katalog
            </span>
            <svg class="icon icon-sm accordion-icon">
              <use href="#icon-chevron-down"></use>
            </svg>
          </button>
          <div class="drawer-sublist">
            <a href="#produk" class="drawer-sublink" data-route="produk">Produk</a>
            <a href="#kategori" class="drawer-sublink" data-route="kategori">Kategori</a>
            <a href="#ulasan" class="drawer-sublink" data-route="ulasan">Ulasan</a>
          </div>
        </div>

        <div class="drawer-group-label">Transaksi</div>
        <a href="#pesanan" class="drawer-link" data-route="pesanan">
          <svg class="icon icon-md">
            <use href="#icon-shopping-bag"></use>
          </svg>
          <span>Pesanan</span>
          <span class="status-pill status-menunggu-pembayaran" style="margin-left: auto;">4</span>
        </a>

        <div class="drawer-group-label">Operasional & Finansial</div>
        <div class="drawer-accordion">
          <button type="button" class="drawer-accordion-btn">
            <span class="left">
              <svg class="icon icon-md">
                <use href="#icon-wallet"></use>
              </svg>
              Stok & Keuangan
            </span>
            <svg class="icon icon-sm accordion-icon">
              <use href="#icon-chevron-down"></use>
            </svg>
          </button>
          <div class="drawer-sublist">
            <a href="#barang-masuk" class="drawer-sublink" data-route="barang-masuk">
              Barang Masuk
              <span class="status-pill status-segera-restock" style="float: right;">3</span>
            </a>
            <a href="#penjualan-langsung" class="drawer-sublink" data-route="penjualan-langsung">Penjualan Langsung</a>
            <a href="#rekap-bulanan" class="drawer-sublink" data-route="rekap-bulanan">Rekap Bulanan</a>
          </div>
        </div>

        <div class="drawer-group-label">Sistem</div>
        <a href="#pengaturan" class="drawer-link" data-route="pengaturan">
          <svg class="icon icon-md">
            <use href="#icon-settings"></use>
          </svg>
          Pengaturan Toko
        </a>
      </nav>

      <div class="drawer-footer">
        <div class="drawer-profile">
          <div class="rail-avatar" style="width: 32px; height: 32px; font-size: 11px;">AD</div>
          <div>
            <div class="drawer-profile-name">Admin</div>
            <div class="drawer-profile-role">Pemilik Toko</div>
          </div>
        </div>
        <a href="login.html" class="btn btn-xs btn-ghost" style="color: var(--admin-sidebar-text);">
          <svg class="icon icon-sm">
            <use href="#icon-log-out"></use>
          </svg>
        </a>
      </div>
    </aside>

    <!-- =====================================================================
         Konten Halaman (Main Content Area)
         ===================================================================== -->
    <main class="admin-main-wrap">
      <!-- Page Header: Breadcrumb & Judul Halaman -->
      <header id="pageHeader" class="admin-header">
        <!-- Rendered via JS -->
      </header>

      <!-- Area Konten Utama -->
      <div id="pageContent" class="admin-content">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <!-- =======================================================================
       Dialog Konfirmasi HTML5 (<dialog>) - Section 4.8
       ======================================================================= -->
  <dialog id="adminConfirmDialog" class="admin-modal">
    <div class="modal-icon-wrap modal-icon-danger">
      <svg class="icon icon-lg">
        <use href="#icon-alert-triangle"></use>
      </svg>
    </div>
    <div class="modal-title">Konfirmasi Tindakan</div>
    <div class="modal-desc">Apakah Anda yakin ingin melanjutkan tindakan ini?</div>
    <div class="modal-actions">
      <button type="button" id="btnDialogCancel" class="btn btn-sm btn-secondary">Batal</button>
      <button type="button" id="btnDialogConfirm" class="btn btn-sm btn-danger">Lanjutkan</button>
    </div>
  </dialog>

  <!-- =======================================================================
       Wadah Toast Notification - Section 4.7
       ======================================================================= -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- JavaScript Logika Panel Admin -->
  <script src="js/admin.js"></script>
</body>

</html>
